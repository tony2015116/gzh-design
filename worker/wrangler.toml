name = "gzh-image-worker"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[[workflows]]
name = "gzh-illustration-workflow"
binding = "ILLUSTRATION_WORKFLOW"
class_name = "IllustrationWorkflow"

[browser]
binding = "BROWSER"

# R2 Bucket 绑定
# 部署前请先在 Cloudflare Dashboard 创建名为 "gzh-images" 的 R2 Bucket
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "gzh-images"

# D1 数据库绑定
# database_id 在执行 `npx wrangler d1 create gzh-typesetter-db` 后从控制台输出复制
# 如果已创建，可从 Cloudflare Dashboard > Workers & Pages > D1 中找到
[[d1_databases]]
binding = "DB"
database_name = "gzh-typesetter-db"
database_id = "YOUR_D1_DATABASE_ID_HERE"

# 环境变量（敏感值请通过 wrangler secret put UPLOAD_SECRET 设置）
[vars]
ALLOWED_ORIGINS = "*"
AI_FORMAT_AUTH_MODE = "user"
AI_FORMAT_LOG_LEVEL = "verbose"
AI_FORMAT_LOG_PREVIEW_CHARS = "240"
GEMINI_IMAGE_MODEL = "gemini-3-pro-image-preview"
