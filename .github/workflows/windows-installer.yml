name: Windows installer

on:
  push:
    branches: [development]
    tags: ['desktop-v*']
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx tsc -b
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm test
        working-directory: app

  build:
    needs: check
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # 打 desktop-v* 标签时用标签里的版本（不必先改 package.json）；其余构建用 主.次 版本 + 运行序号，便于区分
      - name: Set version
        id: version
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            version="${GITHUB_REF_NAME#desktop-v}"
          else
            base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
            version="$base.$GITHUB_RUN_NUMBER"
          fi
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm run package:win -- --publish never
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: app/release/LuoboGzh-Setup-*-x64.exe
          if-no-files-found: error
          compression-level: 0

  # 只有推送 desktop-v* 标签时才发布；推送 development 和 PR 只构建，安装包在 Actions 的 Artifacts 里
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-installer
          path: installer
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="desktop-v$VERSION"
          exe="installer/LuoboGzh-Setup-$VERSION-x64.exe"
          test -s "$exe"
          digest=$(sha256sum "$exe" | cut -d ' ' -f 1)
          asset=$(basename "$exe")
          printf 'Windows x64 安装包（未签名）。下载 EXE 后按安装向导操作。\n\n提交：%s\nSHA-256: %s\n' "${SHA:0:7}" "$digest" > notes.md
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            remote=$(gh release view "$TAG" -R "$REPO" --json assets | jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .digest')
            if [[ -z "$remote" ]]; then
              gh release upload "$TAG" "$exe" -R "$REPO"
            else
              test "$remote" = "sha256:$digest"
            fi
            gh release edit "$TAG" -R "$REPO" --draft=false --notes-file notes.md
          else
            gh release create "$TAG" "$exe" -R "$REPO" --verify-tag --title "$TAG" --notes-file notes.md --latest
          fi
